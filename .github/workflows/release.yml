name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v2.0.0

permissions:
  contents: write

env:
  APP_NAME: Battery for Keychron

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build app
        run: |
          xcodebuild -project KeychronBattery.xcodeproj \
                     -scheme KeychronBattery \
                     -configuration Release \
                     -derivedDataPath ./build \
                     -destination "generic/platform=macOS" \
                     ARCHS="arm64 x86_64" \
                     ONLY_ACTIVE_ARCH=NO \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGN_STYLE=Manual \
                     DEVELOPMENT_TEAM=""

      - name: Verify app bundle
        run: |
          APP="build/Build/Products/Release/$APP_NAME.app"
          lipo -archs "$APP/Contents/MacOS/$APP_NAME"
          codesign -d --entitlements - "$APP"
          du -sh "$APP"

      - name: Create DMG
        run: |
          mkdir -p dmg-staging
          cp -R "build/Build/Products/Release/$APP_NAME.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "$APP_NAME" \
                         -srcfolder dmg-staging \
                         -ov -format UDZO \
                         "BatteryForKeychron-${{ steps.get_version.outputs.VERSION }}.dmg"

      - name: Generate release notes
        run: |
          cat > release_notes.md << 'EOF'
          ## Battery for Keychron ${{ steps.get_version.outputs.VERSION }}

          ### Installation
          1. Download `BatteryForKeychron-${{ steps.get_version.outputs.VERSION }}.dmg`
          2. Open the DMG and drag **Battery for Keychron** to Applications
          3. First launch: right-click the app → **Open** (the app is not notarized)
          4. Allow **Bluetooth** and **Notifications**, and enable the app under
             System Settings → Privacy & Security → **Input Monitoring**, then relaunch

          Updating? Remove and re-add the app in Input Monitoring after installing.

          ### Requirements
          - macOS 15.7 or later
          - Keychron keyboard on Bluetooth (confirmed: K6)
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: BatteryForKeychron-${{ steps.get_version.outputs.VERSION }}.dmg
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up
        run: rm -rf dmg-staging build
